[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "2.0.0"
description = "Ask your Python codebase questions. Get answers. Completely free. Runs locally."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "chromadb>=0.4.0",
    "requests>=2.31.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "gitpython>=3.1.0",
    "jinja2>=3.1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# PyTorch-based models: cross-encoder reranking. Without it, embeddings use
# ChromaDB's bundled ONNX MiniLM and reranking uses a lexical heuristic.
ml = [
    "sentence-transformers>=2.2.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
]
dev = [
    "repomind[server,ml]",
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
repomind = "repomind.cli:app"

# Explicit list: a virtualenv must never be discovered as a subpackage
[tool.setuptools]
packages = ["repomind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008: Typer's documented API style is typer.Option(...) in parameter defaults
ignore = ["B008"]